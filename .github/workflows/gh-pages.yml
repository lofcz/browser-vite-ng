name: Deploy Example to GitHub Pages

on:
  push:
    branches:
      - browser-vite
    paths:
      - 'example/**'
      - 'packages/vite/src/browser/**'
      - 'packages/vite/src/client/**'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      # bun ignores the cpu:["wasm32"] platform constraint that breaks npm, and
      # the repo is bun-only (bun.lock is the single source of truth).
      - name: Install dependencies
        working-directory: example
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: example
        env:
          GITHUB_PAGES: true
        run: bun run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: example/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
