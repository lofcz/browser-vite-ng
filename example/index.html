<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser-Vite Live Editor</title>
    <!-- modern-monaco's init() lazy-loads its editor-core and builtin LSP from
         esm.sh unless the page importmap maps them to local URLs. Point both at
         the /monaco/* URLs served by the monacoModulesPlugin so the editor is
         fully offline. -->
    <script type="importmap">
      {
        "imports": {
          "modern-monaco/editor-core": "/monaco/editor-core.mjs",
          "modern-monaco/lsp": "/monaco/lsp.mjs"
        }
      }
    </script>
  </head>
  <body class="font-sans m-0 p-0 h-screen overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
